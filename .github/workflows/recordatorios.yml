name: Recordatorios - envío diario

on:
  schedule:
    # Cada 10 min: además de disparar recordatorios, mantiene despierto el
    # backend en Render (plan gratis se duerme a los ~15 min sin tráfico).
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar_recordatorios:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar envío de recordatorios
        run: |
          curl -f -X POST \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            https://papayeralaberriondera-app.onrender.com/jobs/recordatorios