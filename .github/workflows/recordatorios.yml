name: Recordatorios - envío diario

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  enviar_recordatorios:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar envío de recordatorios
        run: |
          curl -f -X POST \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            https://papayeralaberriondera-app.onrender.com/jobs/recordatorios